<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contadores" id="contadores">0/0/0 00:00:00</div>
    <div class="forminicial" id="forminicials">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nomeGet">
        <br>
        <label for="idade">Idade:</label>
        <input type="number" name="dade" id="idadeGet">
        <br>
        <select name="generos" id="generos">
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
            <option value="NB">Não Binario</option>
        </select>
        <button onclick="CriaPlayer()">Proximo</button>
    </div>
    <div class="forminicial invisible" id="formsecundario">
        <div id="pontos">Distribua 10 pontos</div>
        <label for="forca">Força:</label>
        <input type="number" name="forca" id="forcas"><br>
        <label for="intelecto">Intelecto:</label>
        <input type="number" name="intelecto" id="intelectos"><br>
        <label for="conhecimento">Conhecimento:</label>
        <input type="number" name="conhecimento" id="conhecimentos"><br>
        <label for="agilidade">Agilidade:</label>
        <input type="number" name="agilidade" id="agilidades"><br>
        <label for="presenca">Presenca:</label>
        <input type="number" name="presenca" id="presencas">
        <button onclick="atualizaPontos()">atualizar</button>
    </div>
    <div class="opcoes invisible" id="opcoesh">
        <button class="opcao, bot" onclick="vaiDormir()">dormir</button>
        <button class="opcao, bot">minerar</button>
        <button class="opcao, bot">plantar</button>
        <button class="opcao, bot">andar</button>
    </div>
    <div class="inventario" id="inventario">
            <div class="slot" id="slot1"></div>
            <div class="slot" id="slot2"></div>
            <div class="slot" id="slot3"></div>
            <div class="slot" id="slot4"></div>
            <div class="slot" id="slot5"></div>
            <div class="slot" id="slot6"></div>
            <div class="slot" id="slot7"></div>
            <div class="slot" id="slot8"></div>
            <div class="slot" id="slot9"></div>
            <div class="slot" id="slot10"></div>
            <div class="slot" id="slot11"></div>
            <div class="slot" id="slot12"></div>
            <div class="slot" id="slot13"></div>
            <div class="slot" id="slot14"></div>
            <div class="slot" id="slot15"></div>
            <div class="slot" id="slot16"></div>
            <div class="slot" id="slot17"></div>
            <div class="slot" id="slot18"></div>
            <div class="slot" id="slot19"></div>
            <div class="slot" id="slot20"></div>
            <div class="slot" id="slot21"></div>
            <div class="slot" id="slot22"></div>
            <div class="slot" id="slot23"></div>
            <div class="slot" id="slot24"></div>
            <div class="slot" id="slot25"></div>
            <div class="slot" id="slot26"></div>
            <div class="slot" id=" slot27"></div>
            <div class="slot" id="slot28"></div>
            <div class="slot" id="armad"></div>
            <div class="slot" id="armadura"></div>
            <div class="slot" id="armae"></div>
    </div>
</body>
<script type="module" src="main.js"></script>
</html>
